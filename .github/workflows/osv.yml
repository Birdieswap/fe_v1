name: OSV Scanner
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # 매주 월 12:00 KST 즈음

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download OSV-Scanner
        run: |
          curl -sSL -o /tmp/osv.tgz \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_Linux_x86_64.tar.gz
          tar -xzf /tmp/osv.tgz -C /usr/local/bin osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan lockfiles (npm)
        run: |
          set -e
          # lockfile/manifest 자동 탐지
          osv-scanner --recursive --lockfile=package-lock.json --format=json \
            > osv-results.json || true

      - name: Upload OSV results
        uses: actions/upload-artifact@v4
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: warn
