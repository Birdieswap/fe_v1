# .github/workflows/osv.yml
name: OSV Scan
on:
  push:
  pull_request:
jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 진짜 락파일이 있는지 먼저 확인 (디버그에 매우 도움됨)
      - name: Show lockfiles
        run: |
          echo "== PWD ==" && pwd
          echo "== lockfiles ==" && find . -maxdepth 4 -type f \( -name "package-lock.json" -o -name "pnpm-lock.yaml" -o -name "yarn.lock" \) -print

      # OSV 바이너리 설치 (아티팩트 레지스트리 최신 릴리스에서)
      - name: Install OSV-Scanner
        run: |
          set -euxo pipefail
          TAG=$(curl -sSL https://api.github.com/repos/google/osv-scanner/releases/latest | jq -r .tag_name)
          curl -sSL -o /tmp/osv.tar.gz "https://github.com/google/osv-scanner/releases/download/${TAG}/osv-scanner_${TAG#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/osv.tar.gz -C /usr/local/bin osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      # 재귀 스캔: 루트부터 모든 lockfile 자동 탐지
      - name: Run OSV (recursive)
        run: |
          set -euxo pipefail
          osv-scanner -r . --skip-git --format json --output osv-results.json
          # 사람이 보기 쉬운 테이블도 같이 저장(선택)
          osv-scanner -r . --skip-git --format table --output osv-table.txt
          # 디펜던시 트리 느낌의 요약이 필요하면 npm ls 등 병행
          if [ -f package-lock.json ]; then
            npx --yes npm@10 ls --all > npm-tree.txt || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: osv-results
          path: |
            osv-results.json
            osv-table.txt
            npm-tree.txt
