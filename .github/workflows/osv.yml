name: OSV Scanner

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # 매주 월 15:00 KST

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for lockfile)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Ensure package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            npm i --package-lock-only --ignore-scripts
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install OSV-Scanner via go install
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          osv-scanner --version

      - name: Run OSV-Scanner
        run: |
          osv-scanner --recursive --lockfile=package-lock.json --format=json > osv-results.json || true

      - name: Upload OSV results
        uses: actions/upload-artifact@v4
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: warn
