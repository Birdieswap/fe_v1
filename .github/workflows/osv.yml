# .github/workflows/osv-scan.yml
name: OSV Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker로 바로 실행 (설치 X)
      - name: Run OSV-Scanner (Docker, generate SARIF + text)
        run: |
          set -euxo pipefail
          docker pull ghcr.io/google/osv-scanner:latest
          # SARIF
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/google/osv-scanner:latest \
            --recursive . --format sarif --output osv.sarif || true
          # Text 리포트(참고용)
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/google/osv-scanner:latest \
            --recursive . --output osv.txt || true

      # 퍼블릭 레포만 SARIF 업로드(프라이빗 + GHAS 미사용이면 실패하므로)
      - name: Upload SARIF to GitHub Code Scanning
        if: github.repository_visibility == 'public'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif

      - name: Upload OSV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-results
          path: |
            osv.sarif
            osv.txt
          if-no-files-found: warn
