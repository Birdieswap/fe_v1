name: OSV Scan

on:
  push:
  pull_request:

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR의 공식 컨테이너로 실행 (GCR 폐지 이슈 회피)
      - name: Run OSV (package-lock.json)
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/google/osv-scanner:latest
          options: -v ${{ github.workspace }}:/workspace
          run: |
            cd /workspace
            # 최우선: lockfile 기준 스캔 (FRONT 앱에는 이게 정확)
            osv-scanner --lockfile=package-lock.json --format json > osv-results.json
            # 보조: 소스 트리 스캔 (선택)
            osv-scanner --recursive --format json . > osv-tree.json || true

      - name: Upload OSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan
          path: |
            osv-results.json
            osv-tree.json
          if-no-files-found: warn
