name: OSV Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read # upload-sarif가 워크플로우 정보 읽을 때 필요
  security-events: write # SARIF 업로드 권한

jobs:
  osv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner 최신 릴리스를 안전하게 설치 (linux x86_64 tar.gz 자동 선택)
      - name: Install OSV-Scanner
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          API="https://api.github.com/repos/google/osv-scanner/releases/latest"
          ASSET_URL=$(curl -fsSL "$API" \
            | jq -r '.assets[] 
              | select((.name|test("linux"; "i")) 
                       and (.name|test("(x86_64|amd64)"; "i")) 
                       and (.name|endswith(".tar.gz"))) 
              | .browser_download_url' \
            | head -n1)
          if [ -z "$ASSET_URL" ]; then
            echo "Failed to find linux x86_64 tar.gz asset" >&2
            exit 1
          fi
          curl -fsSL -o /tmp/osv.tar.gz "$ASSET_URL"
          tar -tzf /tmp/osv.tar.gz >/dev/null  # 무결성 체크
          sudo tar -xzf /tmp/osv.tar.gz -C /usr/local/bin osv-scanner
          /usr/local/bin/osv-scanner --version

      # SARIF + 텍스트 리포트 생성 (실패해도 워크플로우 계속)
      - name: Run OSV-Scanner (generate SARIF)
        run: |
          set -euxo pipefail
          osv-scanner --recursive . --format sarif --output osv.sarif || true
          osv-scanner --recursive . --output osv.txt || true

      # 포크 PR이면 권한 제한으로 실패하므로 업로드 생략
      - name: Upload SARIF to GitHub Code Scanning
        if: github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif

      # 결과물 아티팩트로도 보관
      - name: Upload OSV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-results
          path: |
            osv.sarif
            osv.txt
          if-no-files-found: warn
