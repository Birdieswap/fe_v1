name: ZAP Full Scan

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월 03:00 KST 근처
  push:
    branches: [main, master, dev_fe]
  workflow_dispatch:
    inputs:
      target:
        description: "Override target URL (optional)"
        required: false
        default: "https://birdieswap-dev.vercel.app"

permissions:
  contents: read
  actions: read

env:
  # workflow_dispatch면 inputs.target, 아니면 기본값 사용
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'https://birdieswap-dev.vercel.app' }}

jobs:
  zap-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        continue-on-error: true
        with:
          target: ${{ env.TARGET }}
          cmd_options: "-j -m 5" # JSON + 크롤링 제한
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false

      - name: Upload ZAP Full report
        uses: actions/upload-artifact@v4
        with:
          # 실행마다 고유: run_id, 재실행 때도 고유: run_attempt
          name: zap-full-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
