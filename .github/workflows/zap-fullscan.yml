name: ZAP Full Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 0" # 매주 일 16:00 KST

permissions:
  contents: read

jobs:
  zap-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: "https://birdieswap-dev.vercel.app"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          cmd_options: >
            -m 60                 # spider 최대 60분
            -T 60                 # active scan 타임아웃(분)
            -I                    # (선택) 상태코드 500 무시
            -j                    # JSON 결과 함께
        continue-on-error: true

      - name: Upload ZAP FullScan HTML
        uses: actions/upload-artifact@v4
        with:
          name: zap-fullscan-report
          path: report_html.html
          if-no-files-found: warn
