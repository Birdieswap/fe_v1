name: ZAP Full Scan

on:
  schedule:
    - cron: "0 18 * * 0" # 월 03:00 KST
  push:
    branches: [main, master, dev_fe] # 개발 브랜치에서도 푸시 시 실행
  workflow_dispatch:
    inputs:
      target:
        description: "Override target URL (optional)"
        required: false
        default: "https://birdieswap-dev.vercel.app"

permissions:
  contents: read
  actions: read

jobs:
  zap-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0 # ← 최신
        continue-on-error: true # ← 내부 업로드 실패해도 워크플로우 진행
        with:
          target: ${{ github.event.inputs.target || 'https://birdieswap-dev.vercel.app' }}
          cmd_options: "-j -m 5"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false
          artifact_name: "zap-full-report" # ← 기본 zap_scan 대신

      # 우리가 확실히 업로드 (ZAP 내장 업로드 실패해도 보장)
      - name: Upload ZAP Full report
        uses: actions/upload-artifact@v4
        with:
          name: "zap-full-report"
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn
