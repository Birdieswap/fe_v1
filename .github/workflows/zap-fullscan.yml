name: ZAP Full Scan

on:
  schedule:
    - cron: "0 18 * * 0" # 기본 브랜치에서만 동작 (월 03:00 KST)
  push:
    branches: [main, master, dev_fe] # ← dev 브랜치 푸시 시에도 실행
  workflow_dispatch:
    inputs:
      target:
        description: "Override target URL (optional)"
        required: false
        default: "https://birdieswap-dev.vercel.app"

permissions:
  contents: read
  actions: read

jobs:
  zap-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          # 수동 실행 시 입력값이 있으면 그것을, 아니면 기본값 사용
          target: ${{ github.event.inputs.target || 'https://birdieswap-dev.vercel.app' }}
          cmd_options: "-j -m 5"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false

      - name: Upload ZAP Full report
        uses: actions/upload-artifact@v4
        with:
          name: "zap-full-report"
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn
