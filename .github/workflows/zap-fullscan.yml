name: ZAP Full Scan
on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월 03:00 KST 근처
  workflow_dispatch:

jobs:
  zap-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: "https://birdieswap-dev.vercel.app"
          cmd_options: "-j -m 5"   # JSON 출력 + 사이트맵 한정(필요시 조정)
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false

      - name: Upload ZAP Full report
        uses: actions/upload-artifact@v4
        with:
          name: "zap-full-report"
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn
