name: ZAP Full Scan

on:
  schedule:
    - cron: "0 18 * * 0" # 월 03:00 KST
  push:
    branches: [main, master, dev_fe] # 개발 브랜치에서도 푸시 시 실행
  workflow_dispatch:
    inputs:
      target:
        description: "Override target URL (optional)"
        required: false
        default: "https://birdieswap-dev.vercel.app"

permissions:
  contents: read
  actions: read

jobs:
  zap-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        continue-on-error: true
        with:
          target: ${{ github.event.inputs.target || 'https://birdieswap-dev.vercel.app' }}
          cmd_options: "-j -m 5"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false
          artifact_name: "zap-full-report-${{ github.run_id }}"

      - name: Upload ZAP Full report (canonical)
        uses: actions/upload-artifact@v4
        with:
          # run_id를 넣어 같은 run 내에서의중복을 피함 (항상 유니크)
          name: "zap-full-report-${{ github.run_id }}"
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn
