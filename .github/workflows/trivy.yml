name: Trivy
on: [push, pull_request]
jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.sarif
