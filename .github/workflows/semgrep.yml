# .github/workflows/semgrep.yml
name: Semgrep
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # 월 13:00 KST

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install --upgrade pip
          pip3 install semgrep

      - name: Run Semgrep (produce SARIF + JSON)
        run: |
          semgrep scan --config=p/javascript --severity=ERROR --sarif -o semgrep.sarif || true
          semgrep scan --config=p/javascript --severity=ERROR --json  -o semgrep.json  || true

      - name: Upload Semgrep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: warn
