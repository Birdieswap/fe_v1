name: Semgrep
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  actions: read # ← 이게 없어서 위 에러가 납니다
  security-events: write # SARIF 업로드 권한

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install --upgrade pip
          pip3 install semgrep

      - name: Run Semgrep and produce SARIF + JSON
        run: |
          semgrep scan --config=p/javascript --severity=ERROR --sarif -o semgrep.sarif || true
          semgrep scan --config=p/javascript --severity=ERROR --json  -o semgrep.json  || true

      # 포크에서 온 PR은 SARIF 업로드 생략 (권한 제한)
      - name: Upload SARIF to GitHub Code Scanning
        if: github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep JSON (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: warn
