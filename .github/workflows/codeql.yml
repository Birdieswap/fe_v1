name: CodeQL (No-GHAS Safe)

on:
  push:
    branches: ["main", "dev_fe"]
  pull_request:
    branches: ["main", "dev_fe"]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      # 자바스크립트 추출기가 node_modules 설치 시도하지 않도록
      CODEQL_EXTRACTOR_JAVASCRIPT_INSTALL_NODE_MODULES: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Download CodeQL CLI
        run: |
          curl -L -o codeql.zip https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
          unzip -q codeql.zip -d /opt
          echo "/opt/codeql" >> $GITHUB_PATH

      # --command 제거: 의존성 설치 자체를 건너뜀
      - name: Create CodeQL DB (no build)
        run: |
          /opt/codeql/codeql database create codeql-db \
            --language=javascript \
            --source-root=.

      - name: Run CodeQL Analysis
        run: |
          /opt/codeql/codeql database analyze codeql-db \
            javascript-code-scanning.qls \
            --format=sarifv2.1.0 \
            --output=codeql.sarif || true

      - name: Convert SARIF to HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y dotnet-sdk-8.0
          dotnet tool install --global Microsoft.CodeAnalysis.Sarif.Multitool
          ~/.dotnet/tools/sarif multitool transform codeql.sarif --format html --output codeql-report.html

      - name: Upload CodeQL Reports
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codeql.sarif
            codeql-report.html
          if-no-files-found: warn
