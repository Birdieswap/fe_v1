name: Security Suite (ZAP + CodeQL + Semgrep + Trivy + OSV + SBOM + IaC + Secrets -> 1 HTML/PDF)

on:
  push:
    branches: [main, master, dev_fe]
  pull_request:
    branches: [main, master, dev_fe]
  schedule:
    - cron: "0 18 * * 0" # 매주 월 03:00 KST 근처(UTC 일 18:00)
  workflow_dispatch:

concurrency:
  group: security-suite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------- ZAP (DAST) ----------------------------
  zap-target-matrix:
    runs-on: ubuntu-latest
    outputs:
      baseline_matrix: ${{ steps.set.outputs.baseline_matrix }}
      full_matrix: ${{ steps.set.outputs.full_matrix }}
      smoke_matrix: ${{ steps.set.outputs.smoke_matrix }}
    steps:
      - name: Build branch-aware ZAP matrices
        id: set
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          LANDING_SCAN_URL: ${{ vars.LANDING_SCAN_URL }}
          APP_SCAN_URL: ${{ vars.APP_SCAN_URL }}
          API_SCAN_URL: ${{ vars.API_SCAN_URL }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_BRANCH" == "main" || "$TARGET_BRANCH" == "master" ]]; then
            baseline_matrix='{"include":[
              {"name":"landing-www","target":"https://www.birdieswap.com"},
              {"name":"landing-root","target":"https://birdieswap.com"},
              {"name":"app","target":"https://app.birdieswap.com"},
              {"name":"api-healthz","target":"https://api.birdieswap.com/healthz"}
            ]}'
            full_matrix='{"include":[
              {"name":"app","target":"https://app.birdieswap.com"}
            ]}'
            smoke_matrix='{"include":[
              {"name":"landing-www","kind":"web","target":"https://www.birdieswap.com"},
              {"name":"landing-root","kind":"web","target":"https://birdieswap.com"},
              {"name":"app","kind":"web","target":"https://app.birdieswap.com"},
              {"name":"api-healthz","kind":"api","target":"https://api.birdieswap.com/healthz"}
            ]}'
          else
            landing="${LANDING_SCAN_URL:-https://birdieswap-landing.vercel.app}"
            app="${APP_SCAN_URL:-https://birdieswap-dev.vercel.app}"
            api="${API_SCAN_URL:-https://api.birdieswap.com/healthz}"

            baseline_matrix=$(jq -cn \
              --arg landing "$landing" \
              --arg app "$app" \
              --arg api "$api" \
              '{include:[
                {name:"landing", target:$landing},
                {name:"app", target:$app},
                {name:"api-healthz", target:$api}
              ]}')
            full_matrix=$(jq -cn \
              --arg app "$app" \
              '{include:[{name:"app", target:$app}]}')
            smoke_matrix=$(jq -cn \
              --arg landing "$landing" \
              --arg app "$app" \
              --arg api "$api" \
              '{include:[
                {name:"landing", kind:"web", target:$landing},
                {name:"app", kind:"web", target:$app},
                {name:"api-healthz", kind:"api", target:$api}
              ]}')
          fi

          echo "baseline_matrix=$baseline_matrix" >> "$GITHUB_OUTPUT"
          echo "full_matrix=$full_matrix" >> "$GITHUB_OUTPUT"
          echo "smoke_matrix=$smoke_matrix" >> "$GITHUB_OUTPUT"

  zap-baseline:
    needs: [zap-target-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.zap-target-matrix.outputs.baseline_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ matrix.target }}
          cmd_options: "-j -m 5 -T 120"
          docker_name: "zaproxy/zap-stable"
          allow_issue_writing: false
          artifact_name: zap-scan-baseline-${{ matrix.name }}

      - name: Rename ZAP Baseline JSON by target
        shell: bash
        run: |
          name="${{ matrix.name }}"
          suffix=""
          case "$name" in
            *healthz*|api-healthz) suffix="healthz" ;;
            *landing*|landing-www|landing-root) suffix="landing" ;;
            *app*) suffix="app" ;;
            *) suffix="$(echo "$name" | tr -cs '[:alnum:]_-' '_' | sed 's/^_//; s/_$//')" ;;
          esac
          if [ -f report_json.json ]; then
            cp report_json.json "report_${suffix}.json"
          fi

      - name: Upload ZAP Baseline reports
        uses: actions/upload-artifact@v6
        with:
          name: zap_baseline_${{ matrix.name }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            report_html.html
            report_json.json
            report_*.json
          if-no-files-found: warn

  zap-full:
    needs: [zap-target-matrix]
    if: ${{ (github.base_ref || github.ref_name) == 'main' || (github.base_ref || github.ref_name) == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.zap-target-matrix.outputs.full_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: ${{ matrix.target }}
          cmd_options: "-j -m 2 -T 30"
          docker_name: "zaproxy/zap-stable"
          allow_issue_writing: false
          artifact_name: zap-scan-full-${{ matrix.name }}

      - name: Rename ZAP Full JSON by target
        shell: bash
        run: |
          name="${{ matrix.name }}"
          suffix=""
          case "$name" in
            *healthz*|api-healthz) suffix="healthz" ;;
            *landing*|landing-www|landing-root) suffix="landing" ;;
            *app*) suffix="app" ;;
            *) suffix="$(echo "$name" | tr -cs '[:alnum:]_-' '_' | sed 's/^_//; s/_$//')" ;;
          esac
          if [ -f report_json.json ]; then
            cp report_json.json "report_${suffix}.json"
          fi

      - name: Upload ZAP Full reports
        uses: actions/upload-artifact@v6
        with:
          name: zap_full_${{ matrix.name }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            report_html.html
            report_json.json
            report_*.json
          if-no-files-found: warn

  # ---------------------------- Header Smoke ----------------------------
  header-smoke:
    needs: [zap-target-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.zap-target-matrix.outputs.smoke_matrix) }}
    steps:
      - name: Fetch response
        run: |
          status_code="$(curl -fsSL --retry 2 --retry-delay 2 -D headers.raw -o body.txt -w "%{http_code}" "${{ matrix.target }}")"
          echo "${status_code}" > status_code.txt
          awk 'BEGIN{RS="\r\n\r\n"} {last=$0} END{print last}' headers.raw | tr -d '\r' > headers.txt
          echo "HTTP ${status_code}"
          cat headers.txt
          cat body.txt || true

      - name: Assert common headers
        if: matrix.kind == 'web'
        run: |
          grep -qiE '^strict-transport-security:' headers.txt
          grep -qiE '^x-content-type-options:[[:space:]]*nosniff' headers.txt

      - name: Assert web headers
        if: matrix.kind == 'web'
        run: |
          grep -qiE '^(content-security-policy|content-security-policy-report-only):' headers.txt || echo "warning: CSP header missing"
          grep -qiE '^referrer-policy:' headers.txt || echo "warning: referrer-policy missing"

      - name: Assert api healthz
        if: matrix.kind == 'api'
        run: |
          code="$(cat status_code.txt)"
          echo "$code" | grep -qE '^(2|3)[0-9][0-9]$'
          grep -qiE '^content-type:[[:space:]]*(application/json|application/health\\+json|text/plain)' headers.txt || echo "warning: unexpected content-type"
          python3 - <<'PY'
          import json
          from pathlib import Path
          body = Path("body.txt").read_text(encoding="utf-8").strip()
          if not body:
              raise SystemExit("Empty healthz response body")
          try:
              data = json.loads(body)
          except Exception:
              data = None
          if isinstance(data, dict):
              status = str(data.get("status", "")).lower()
              ok = data.get("ok") is True or status in {"ok", "healthy", "up"}
          else:
              ok = body.lower() in {"ok", "healthy", "up"} or '"status":"ok"' in body.replace(" ", "").lower()
          if not ok:
              raise SystemExit(f"Unexpected healthz body: {body!r}")
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: header-smoke-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            status_code.txt
            headers.raw
            headers.txt
            body.txt

  # ---------------------------- CodeQL ----------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # code scanning에 업로드하려면 아래 주석 해제하고 analyze의 upload 사용
      # security-events: write
    env:
      CODEQL_EXTRACTOR_JAVASCRIPT_INSTALL_NODE_MODULES: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Download CodeQL CLI
        run: |
          curl -L -o codeql.zip https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
          unzip -q codeql.zip -d /opt
          echo "/opt/codeql" >> $GITHUB_PATH

      - name: Create CodeQL DB (no build)
        run: |
          set -euo pipefail
          /opt/codeql/codeql database create codeql-db \
            --language=javascript \
            --source-root=. 2>&1 | tee codeql-db-create.log

      - name: Run CodeQL Analysis -> SARIF
        run: |
          set -euo pipefail
          /opt/codeql/codeql database analyze codeql-db \
            codeql/javascript-queries:codeql-suites/javascript-code-scanning.qls \
            --download \
            --threads=1 \
            --ram=6144 \
            --format=sarifv2.1.0 \
            --output=codeql.sarif 2>&1 | tee codeql-analyze.log

      - name: Upload CodeQL diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codeql-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codeql-db-create.log
            codeql-analyze.log
          if-no-files-found: warn

      - name: Upload CodeQL SARIF artifact (for aggregate job)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: sarif-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql.sarif
          if-no-files-found: error

  # ---------------------------- Semgrep ----------------------------
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config=p/javascript --exclude node_modules --sarif -o semgrep.sarif || true

      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v6
        with:
          name: sarif-semgrep-${{ github.run_id }}-${{ github.run_attempt }}
          path: semgrep.sarif
          if-no-files-found: error

  # ---------------------------- Secrets: Gitleaks ----------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.2 \
            dir /repo --config /repo/.gitleaks.toml --report-format sarif --report-path /repo/gitleaks.sarif --redact --exit-code 0 || true
          if [ ! -s gitleaks.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > gitleaks.sarif
          fi

      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sarif-gitleaks-${{ github.run_id }}-${{ github.run_attempt }}
          path: gitleaks.sarif
          if-no-files-found: warn

  # ---------------------------- SCA: Trivy (FS) ----------------------------
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy FS scan (SARIF, retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            docker run --rm \
              -v "$PWD:/workdir" \
              -w /workdir \
              aquasec/trivy:0.58.1 \
              fs \
              --format sarif \
              --output trivy.sarif \
              --ignore-unfixed \
              --timeout 10m \
              . && break
            if [ "$i" -eq 3 ]; then
              echo "Trivy FS scan failed after 3 attempts"
              exit 1
            fi
            echo "Trivy FS scan failed (attempt $i). Retrying in 10s..."
            sleep 10
          done

      - name: Upload Trivy FS SARIF
        uses: actions/upload-artifact@v6
        with:
          name: sarif-trivy-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy.sarif
          if-no-files-found: error

  # ---------------------------- SCA: OSV ----------------------------
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install OSV-Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          export GOBIN=/usr/local/bin
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest

      - name: Run OSV
        run: |
          osv-scanner --format sarif --output osv.sarif --skip-git . || true

      - name: Upload OSV SARIF
        uses: actions/upload-artifact@v6
        with:
          name: sarif-osv-${{ github.run_id }}-${{ github.run_attempt }}
          path: osv.sarif
          if-no-files-found: error

  # ---------------------------- IaC: tfsec + Checkov ----------------------------
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run tfsec (SARIF)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          format: sarif
          additional_args: >-
            --out tfsec.sarif
          soft_fail: false

      - name: Upload tfsec SARIF
        uses: actions/upload-artifact@v6
        with:
          name: sarif-tfsec-${{ github.run_id }}-${{ github.run_attempt }}
          path: tfsec.sarif
          if-no-files-found: error

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov (IaC)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_file_path: checkov.sarif
          output_format: sarif
          quiet: true
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: actions/upload-artifact@v6
        with:
          name: sarif-checkov-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkov.sarif
          if-no-files-found: warn

  # ---------------------------- Dockerfile lint ----------------------------
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run hadolint or mark skipped
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./Dockerfile ]; then
            HDL=v2.12.0
            sudo wget -qO /usr/local/bin/hadolint \
              "https://github.com/hadolint/hadolint/releases/download/${HDL}/hadolint-Linux-x86_64"
            sudo chmod +x /usr/local/bin/hadolint
            set +e
            /usr/local/bin/hadolint -f sarif ./Dockerfile > hadolint.sarif 2> hadolint.stderr
            rc=$?
            set -e
            if [ "${rc}" -ne 0 ] && [ ! -s hadolint.sarif ]; then
              printf '%s\n' "hadolint failed with exit code ${rc}; no SARIF output generated." > hadolint-error.txt
              jq -n \
                --arg msg "hadolint execution failed (exit ${rc}). See hadolint.stderr artifact." \
                '{version:"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json",runs:[{tool:{driver:{name:"hadolint",informationUri:"https://github.com/hadolint/hadolint"}},invocations:[{executionSuccessful:false,toolExecutionNotifications:[{level:"error",message:{text:$msg}}]}],results:[{ruleId:"HADOLINT_EXECUTION_FAILED",level:"error",message:{text:$msg}}]}]}' > hadolint.sarif
            fi
          else
            # Dockerfile이 없으면 skipped 상태를 SARIF에 명시
            jq -n \
              --arg msg "Skipped hadolint scan: no Dockerfile found at ./Dockerfile" \
              '{version:"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json",runs:[{tool:{driver:{name:"hadolint",informationUri:"https://github.com/hadolint/hadolint"}},invocations:[{executionSuccessful:true,toolExecutionNotifications:[{level:"note",message:{text:$msg}}]}],results:[{ruleId:"HADOLINT_SKIPPED_NO_DOCKERFILE",level:"note",message:{text:$msg}}]}]}' > hadolint.sarif
            printf '%s\n' "skipped(no Dockerfile): ./Dockerfile not found" > hadolint-skip.txt
          fi

      - name: Upload hadolint diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hadolint-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hadolint.stderr
            hadolint-error.txt
            hadolint-skip.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        with:
          name: sarif-hadolint-${{ github.run_id }}-${{ github.run_attempt }}
          path: hadolint.sarif
          if-no-files-found: warn

    # ---------------------------- Build container + Image scans ----------------------------
  container_build_and_scan:
    runs-on: ubuntu-latest
    needs: [hadolint]
    outputs:
      will_build: ${{ steps.build.outputs.will_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image (if Dockerfile exists)
        id: build
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            IMAGE="ghcr.io/${{ github.repository_owner }}/$(basename "$GITHUB_REPOSITORY"):${{ github.sha }}"
            echo "will_build=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            docker build -t "$IMAGE" .
          else
            echo "will_build=false" >> "$GITHUB_OUTPUT"
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install syft & grype
        if: steps.build.outputs.will_build == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX JSON)
        if: steps.build.outputs.will_build == 'true'
        run: |
          syft "$IMAGE" -o cyclonedx-json > sbom.json

      - name: Scan SBOM with grype -> JSON
        if: steps.build.outputs.will_build == 'true'
        run: |
          grype sbom:sbom.json -o json > grype.json || true

      - name: Convert grype JSON -> SARIF (safe)
        if: steps.build.outputs.will_build == 'true'
        shell: bash
        run: |
          # 파이썬 파일로 저장 (닫는 PY는 반드시 맨 왼쪽!)
          cat > grype_to_sarif.py <<'PY'
          import json, sys

          sarif = {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{
              "tool": {"driver": {"name": "grype"}},
              "results": []
            }]
          }

          try:
            with open("grype.json", "r", encoding="utf-8") as f:
              data = json.load(f)
            for m in data.get("matches", []):
              v = (m.get("vulnerability") or {})
              art = (m.get("artifact") or {})
              vid = v.get("id") or "UNKNOWN"
              sev = (v.get("severity") or "UNKNOWN").upper()
              pkg = art.get("name") or "artifact"
              level = "error" if sev in ("CRITICAL", "HIGH") else "warning"
              sarif["runs"][0]["results"].append({
                "ruleId": vid,
                "level": level,
                "message": {"text": f"{vid} on {pkg} ({sev})"}
              })
          except Exception as e:
            print(f"[grype->sarif] parse warning: {e}", file=sys.stderr)

          with open("grype.sarif", "w", encoding="utf-8") as f:
            json.dump(sarif, f)
          PY
          python3 grype_to_sarif.py

      - name: Trivy Image scan -> SARIF
        if: steps.build.outputs.will_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workdir" \
              -w /workdir \
              aquasec/trivy:0.58.1 \
              image \
              --format sarif \
              --output trivy-image.sarif \
              --ignore-unfixed \
              --timeout 10m \
              "${{ steps.build.outputs.image }}" && break
            if [ "$i" -eq 3 ]; then
              echo "Trivy image scan failed after 3 attempts"
              exit 1
            fi
            echo "Trivy image scan failed (attempt $i). Retrying in 10s..."
            sleep 10
          done

      - name: Dockle (container best-practices)
        if: steps.build.outputs.will_build == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.14 -f sarif "${{ steps.build.outputs.image }}" > dockle.sarif || true

      - name: Upload image scan artifacts
        if: steps.build.outputs.will_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: container-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sbom.json
            grype.json
            grype.sarif
            trivy-image.sarif
            dockle.sarif
          if-no-files-found: warn

  # ---------------------------- Package manager audits ----------------------------
  pm_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node.js setup (if JS project)
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: npm audit (if package-lock.json)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || true
            npm audit --json > npm-audit.json || true
          else
            echo '{}' > npm-audit.json
          fi

      - name: yarn audit (if yarn.lock)
        shell: bash
        run: |
          if [ -f yarn.lock ]; then
            corepack enable || true
            yarn install --immutable || true
            yarn audit --json > yarn-audit.json || true
          else
            echo '{}' > yarn-audit.json
          fi

      - name: pnpm audit (if pnpm-lock.yaml)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable || true
            pnpm install --frozen-lockfile || true
            pnpm audit --json > pnpm-audit.json || true
          else
            echo '{}' > pnpm-audit.json
          fi

      - name: Convert *-audit.json -> SARIF (simple)
        run: |
          python3 - <<'PY'
          import json, glob
          sarif = {
            "version":"2.1.0",
            "$schema":"https://json.schemastore.org/sarif-2.1.0.json",
            "runs":[{"tool":{"driver":{"name":"package-audit"}},"results":[]}]
          }
          advisories = []
          for f in glob.glob("*-audit.json"):
            try:
              d = json.load(open(f))
              # npm v7+ summary 형태
              if isinstance(d.get("advisories"), dict):
                advisories.extend(d["advisories"].values())
              # yarn/pnpm 등 형태
              vulns = d.get("vulnerabilities")
              if isinstance(vulns, dict):
                for items in vulns.values():
                  if isinstance(items, list):
                    advisories.extend(items)
            except Exception:
              pass

          for a in advisories:
            rid = str(a.get("id") or a.get("advisoryId") or a.get("module_name") or "pkg-advisory")
            sev = str(a.get("severity") or a.get("severitySource") or "UNKNOWN")
            pkg = str(a.get("module_name") or a.get("package") or "package")
            lvl = "error" if sev.lower() in ("critical","high") else "warning"
            sarif["runs"][0]["results"].append({"ruleId":rid,"level":lvl,"message":{"text":f"{rid} on {pkg} ({sev})"}})

          open("package-audit.sarif","w").write(json.dumps(sarif))
          PY

      - name: Upload package-audit SARIF
        uses: actions/upload-artifact@v6
        with:
          name: sarif-pm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-audit.sarif
          if-no-files-found: warn

  # ---------------------------- Dependency Review (PR only) ----------------------------
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------- Aggregate / HTML / PDF ----------------------------
  aggregate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - zap-baseline
      - zap-full
      - header-smoke
      - codeql
      - semgrep
      - gitleaks
      - trivy
      - osv
      - tfsec
      - checkov
      - hadolint
      - container_build_and_scan
      - pm_audit
    steps:
      - uses: actions/checkout@v5

      - name: Download SARIF artifacts (sarif-*)
        uses: actions/download-artifact@v8
        with:
          pattern: sarif-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: sarif_in
          merge-multiple: true

      - name: Download container scan artifacts
        if: needs.container_build_and_scan.outputs.will_build == 'true'
        uses: actions/download-artifact@v8
        with:
          name: container-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: sarif_in
        continue-on-error: true

      - name: Download ZAP Baseline reports
        uses: actions/download-artifact@v8
        with:
          pattern: zap_baseline_*_${{ github.run_id }}_${{ github.run_attempt }}
          path: zap_baseline
          merge-multiple: false
        continue-on-error: true

      - name: Download ZAP Full reports
        uses: actions/download-artifact@v8
        with:
          pattern: zap_full_*_${{ github.run_id }}_${{ github.run_attempt }}
          path: zap_full
          merge-multiple: false
        continue-on-error: true

      - name: Convert ZAP reports to SARIF (for combined.sarif)
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def sev_from_riskcode(riskcode):
            rc = str(riskcode or "")
            if rc == "3":
              return "error"
            if rc == "2":
              return "warning"
            return "note"

          def collect_json_files(root):
            p = Path(root)
            if not p.exists():
              return []
            grouped = {}
            for f in p.rglob("*.json"):
              n = f.name
              if not re.match(r"^report(_json)?(_[A-Za-z0-9_-]+)?\.json$", n):
                continue
              grouped.setdefault(f.parent, []).append(f)

            out = []
            for parent, files in grouped.items():
              named = [f for f in files if f.name != "report_json.json"]
              if named:
                out.extend(named)
              else:
                out.extend(files)
            return sorted(out)

          def to_sarif(doc, tool_name):
            rules = {}
            results = []
            sites = doc.get("site", []) if isinstance(doc, dict) else []
            for site in sites:
              site_url = site.get("@name", "")
              alerts = site.get("alerts", []) if isinstance(site, dict) else []
              for alert in alerts:
                rid = str(alert.get("pluginid") or alert.get("alertRef") or alert.get("alert") or "ZAP")
                rname = str(alert.get("alert") or rid)
                desc = str(alert.get("desc") or rname)
                if rid not in rules:
                  rules[rid] = {
                    "id": rid,
                    "name": rname,
                    "shortDescription": {"text": rname},
                    "fullDescription": {"text": desc},
                  }
                level = sev_from_riskcode(alert.get("riskcode"))
                instances = alert.get("instances", []) if isinstance(alert, dict) else []
                if not instances:
                  results.append({
                    "ruleId": rid,
                    "level": level,
                    "message": {"text": desc},
                    "locations": [{
                      "physicalLocation": {
                        "artifactLocation": {"uri": site_url}
                      }
                    }]
                  })
                  continue
                for inst in instances:
                  uri = ""
                  if isinstance(inst, dict):
                    uri = str(inst.get("uri") or "")
                  results.append({
                    "ruleId": rid,
                    "level": level,
                    "message": {"text": desc},
                    "locations": [{
                      "physicalLocation": {
                        "artifactLocation": {"uri": uri or site_url}
                      }
                    }]
                  })
            return {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                "tool": {
                  "driver": {
                    "name": tool_name,
                    "rules": list(rules.values())
                  }
                },
                "results": results
              }]
            }

          Path("sarif_in").mkdir(parents=True, exist_ok=True)

          converted = 0
          for root, prefix, tool_name in [
            ("zap_baseline", "zap-baseline", "ZAP Baseline"),
            ("zap_full", "zap-full", "ZAP Full"),
          ]:
            for src in collect_json_files(root):
              try:
                doc = json.loads(src.read_text(encoding="utf-8"))
              except Exception as e:
                print(f"[zap->sarif] skip parse error: {src}: {e}")
                continue
              rel = src.as_posix()
              rel = re.sub(r"[^a-zA-Z0-9._-]+", "-", rel).strip("-")
              out = Path("sarif_in") / f"{prefix}-{rel}.sarif"
              out.write_text(json.dumps(to_sarif(doc, tool_name)), encoding="utf-8")
              converted += 1
              print(f"[zap->sarif] wrote {out}")

          print(f"[zap->sarif] converted files: {converted}")
          PY

      - name: Merge SARIFs
        run: |
          sudo apt-get update && sudo apt-get install -y dotnet-sdk-8.0 jq wkhtmltopdf
          dotnet tool install --global Sarif.Multitool
          export PATH="$PATH:$HOME/.dotnet/tools"
          shopt -s nullglob
          files=(sarif_in/**/*.sarif sarif_in/*.sarif)
          if [ ${#files[@]} -gt 0 ]; then
            sarif merge "${files[@]}" --output-file combined.sarif --log ForceOverwrite || true
          else
            jq -n '{version:"2.1.0", "$schema":"https://json.schemastore.org/sarif-2.1.0.json", runs:[]}' > combined.sarif
          fi

      - name: Build HTML summary from SARIF
        run: |
          node scripts/summarize-sarif.cjs \
            --in sarif_in \
            --combined combined.sarif \
            --zapBaselineDir zap_baseline \
            --zapFullDir zap_full \
            --out summary.html

      - name: Build PDF
        run: |
          wkhtmltopdf --enable-local-file-access summary.html combined.pdf || touch combined.pdf

      - name: Upload combined results
        uses: actions/upload-artifact@v6
        with:
          name: security-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            combined.sarif
            summary.html
            combined.pdf

  # ---------------------------- Upload to Code Scanning UI ----------------------------
  upload-to-code-scanning:
    runs-on: ubuntu-latest
    needs: [aggregate]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: security-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: out

      - name: Upload merged SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/combined.sarif
