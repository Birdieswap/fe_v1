name: Security Suite (ZAP + CodeQL + Semgrep + Trivy + OSV + SBOM + IaC + Secrets -> 1 HTML/PDF)

on:
  push:
    branches: [main, master, dev_fe]
  pull_request:
    branches: [main, master, dev_fe]
  schedule:
    - cron: "0 18 * * 0" # 매주 월 03:00 KST 근처(UTC 일 18:00)
  workflow_dispatch:

concurrency:
  group: security-suite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

env:
  ZAP_TARGET_DEFAULT: https://birdieswap-dev.vercel.app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------- ZAP (DAST) ----------------------------
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ZAP target
        id: zap_target
        shell: bash
        run: |
          if [ -n "${{ vars.PREVIEW_URL }}" ]; then
            TARGET="${{ vars.PREVIEW_URL }}"
          else
            TARGET="${{ env.ZAP_TARGET_DEFAULT }}"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ steps.zap_target.outputs.target }}
          cmd_options: "-j -m 5 -T 120"
          allow_issue_writing: false
          artifact_name: zap-scan-baseline

      - name: Upload ZAP Baseline reports
        uses: actions/upload-artifact@v4
        with:
          name: zap_baseline_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn

  zap-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ZAP target
        id: zap_target
        shell: bash
        run: |
          if [ -n "${{ vars.PREVIEW_URL }}" ]; then
            TARGET="${{ vars.PREVIEW_URL }}"
          else
            TARGET="${{ env.ZAP_TARGET_DEFAULT }}"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: ${{ steps.zap_target.outputs.target }}
          cmd_options: "-j -m 5"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false
          artifact_name: zap-scan-full

      - name: Upload ZAP Full reports
        uses: actions/upload-artifact@v4
        with:
          name: zap_full_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn

  # ---------------------------- CodeQL ----------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # code scanning에 업로드하려면 아래 주석 해제하고 analyze의 upload 사용
      # security-events: write
    env:
      CODEQL_EXTRACTOR_JAVASCRIPT_INSTALL_NODE_MODULES: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Download CodeQL CLI
        run: |
          curl -L -o codeql.zip https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
          unzip -q codeql.zip -d /opt
          echo "/opt/codeql" >> $GITHUB_PATH

      - name: Create CodeQL DB (no build)
        run: |
          /opt/codeql/codeql database create codeql-db \
            --language=javascript \
            --source-root=.

      - name: Run CodeQL Analysis -> SARIF
        run: |
          /opt/codeql/codeql database analyze codeql-db \
            javascript-code-scanning.qls \
            --format=sarifv2.1.0 \
            --output=codeql.sarif || true

      - name: Ensure SARIF exists (even if empty)
        run: |
          if [ ! -s codeql.sarif ]; then
            cat > codeql.sarif <<'JSON'
            {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": []
            }
          JSON
          fi

      - name: Upload CodeQL SARIF artifact (for aggregate job)
        uses: actions/upload-artifact@v4
        with:
          name: sarif-codeql-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql.sarif
          if-no-files-found: error

  # ---------------------------- Semgrep ----------------------------
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config=p/javascript --exclude node_modules --sarif -o semgrep.sarif || true

      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep-${{ github.run_id }}-${{ github.run_attempt }}
          path: semgrep.sarif
          if-no-files-found: error

  # ---------------------------- SCA: Trivy (FS) ----------------------------
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          ignore-unfixed: true
          timeout: 10m
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy FS SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy.sarif
          if-no-files-found: error

  # ---------------------------- SCA: OSV ----------------------------
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          export GOBIN=/usr/local/bin
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest

      - name: Run OSV
        run: |
          osv-scanner --format sarif --output osv.sarif --skip-git . || true

      - name: Upload OSV SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-osv-${{ github.run_id }}-${{ github.run_attempt }}
          path: osv.sarif
          if-no-files-found: error

  # ---------------------------- IaC: tfsec + Checkov ----------------------------
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec (SARIF)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          format: sarif
          additional_args: >-
            --out tfsec.sarif
          soft_fail: false

      - name: Upload tfsec SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-tfsec-${{ github.run_id }}-${{ github.run_attempt }}
          path: tfsec.sarif
          if-no-files-found: error

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (IaC)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_file_path: checkov.sarif
          output_format: sarif
          quiet: true
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-checkov-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkov.sarif
          if-no-files-found: warn

  # ---------------------------- Dockerfile lint ----------------------------
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f ./Dockerfile ]; then
            HDL=v2.12.0
            sudo wget -qO /usr/local/bin/hadolint \
              "https://github.com/hadolint/hadolint/releases/download/${HDL}/hadolint-Linux-x86_64"
            sudo chmod +x /usr/local/bin/hadolint
            /usr/local/bin/hadolint -f sarif ./Dockerfile > hadolint.sarif || true
          else
            # Dockerfile 없으면 빈 SARIF 만들어서 다음 단계들이 실패하지 않게 함
            printf '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}\n' > hadolint.sarif
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-hadolint-${{ github.run_id }}-${{ github.run_attempt }}
          path: hadolint.sarif
          if-no-files-found: warn

    # ---------------------------- Build container + Image scans ----------------------------
  container_build_and_scan:
    runs-on: ubuntu-latest
    needs: [hadolint]
    outputs:
      will_build: ${{ steps.build.outputs.will_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (if Dockerfile exists)
        id: build
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            IMAGE="ghcr.io/${{ github.repository_owner }}/$(basename "$GITHUB_REPOSITORY"):${{ github.sha }}"
            echo "will_build=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            docker build -t "$IMAGE" .
          else
            echo "will_build=false" >> "$GITHUB_OUTPUT"
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install syft & grype
        if: steps.build.outputs.will_build == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX JSON)
        if: steps.build.outputs.will_build == 'true'
        run: |
          syft "$IMAGE" -o cyclonedx-json > sbom.json

      - name: Scan SBOM with grype -> JSON
        if: steps.build.outputs.will_build == 'true'
        run: |
          grype sbom:sbom.json -o json > grype.json || true

      - name: Convert grype JSON -> SARIF (safe)
        if: steps.build.outputs.will_build == 'true'
        shell: bash
        run: |
          # 파이썬 파일로 저장 (닫는 PY는 반드시 맨 왼쪽!)
          cat > grype_to_sarif.py <<'PY'
          import json, sys

          sarif = {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{
              "tool": {"driver": {"name": "grype"}},
              "results": []
            }]
          }

          try:
            with open("grype.json", "r", encoding="utf-8") as f:
              data = json.load(f)
            for m in data.get("matches", []):
              v = (m.get("vulnerability") or {})
              art = (m.get("artifact") or {})
              vid = v.get("id") or "UNKNOWN"
              sev = (v.get("severity") or "UNKNOWN").upper()
              pkg = art.get("name") or "artifact"
              level = "error" if sev in ("CRITICAL", "HIGH") else "warning"
              sarif["runs"][0]["results"].append({
                "ruleId": vid,
                "level": level,
                "message": {"text": f"{vid} on {pkg} ({sev})"}
              })
          except Exception as e:
            print(f"[grype->sarif] parse warning: {e}", file=sys.stderr)

          with open("grype.sarif", "w", encoding="utf-8") as f:
            json.dump(sarif, f)
          PY
          python3 grype_to_sarif.py

      - name: Trivy Image scan -> SARIF
        if: steps.build.outputs.will_build == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
          timeout: 10m
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockle (container best-practices)
        if: steps.build.outputs.will_build == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.14 -f sarif "${{ steps.build.outputs.image }}" > dockle.sarif || true

      - name: Upload image scan artifacts
        if: steps.build.outputs.will_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: container-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sbom.json
            grype.json
            grype.sarif
            trivy-image.sarif
            dockle.sarif
          if-no-files-found: warn

  # ---------------------------- Package manager audits ----------------------------
  pm_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js setup (if JS project)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (if package-lock.json)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || true
            npm audit --json > npm-audit.json || true
          else
            echo '{}' > npm-audit.json
          fi

      - name: yarn audit (if yarn.lock)
        shell: bash
        run: |
          if [ -f yarn.lock ]; then
            corepack enable || true
            yarn install --immutable || true
            yarn audit --json > yarn-audit.json || true
          else
            echo '{}' > yarn-audit.json
          fi

      - name: pnpm audit (if pnpm-lock.yaml)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable || true
            pnpm install --frozen-lockfile || true
            pnpm audit --json > pnpm-audit.json || true
          else
            echo '{}' > pnpm-audit.json
          fi

      - name: Convert *-audit.json -> SARIF (simple)
        run: |
          python3 - <<'PY'
          import json, glob
          sarif = {
            "version":"2.1.0",
            "$schema":"https://json.schemastore.org/sarif-2.1.0.json",
            "runs":[{"tool":{"driver":{"name":"package-audit"}},"results":[]}]
          }
          advisories = []
          for f in glob.glob("*-audit.json"):
            try:
              d = json.load(open(f))
              # npm v7+ summary 형태
              if isinstance(d.get("advisories"), dict):
                advisories.extend(d["advisories"].values())
              # yarn/pnpm 등 형태
              vulns = d.get("vulnerabilities")
              if isinstance(vulns, dict):
                for items in vulns.values():
                  if isinstance(items, list):
                    advisories.extend(items)
            except Exception:
              pass

          for a in advisories:
            rid = str(a.get("id") or a.get("advisoryId") or a.get("module_name") or "pkg-advisory")
            sev = str(a.get("severity") or a.get("severitySource") or "UNKNOWN")
            pkg = str(a.get("module_name") or a.get("package") or "package")
            lvl = "error" if sev.lower() in ("critical","high") else "warning"
            sarif["runs"][0]["results"].append({"ruleId":rid,"level":lvl,"message":{"text":f"{rid} on {pkg} ({sev})"}})

          open("package-audit.sarif","w").write(json.dumps(sarif))
          PY

      - name: Upload package-audit SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-pm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-audit.sarif
          if-no-files-found: warn

  # ---------------------------- Dependency Review (PR only) ----------------------------
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------- Aggregate / HTML / PDF ----------------------------
  aggregate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - zap-baseline
      - zap-full
      - codeql
      - semgrep
      - trivy
      - osv
      - tfsec
      - checkov
      - hadolint
      - container_build_and_scan
      - pm_audit
    steps:
      - uses: actions/checkout@v4

      - name: Download SARIF artifacts (sarif-*)
        uses: actions/download-artifact@v4
        with:
          pattern: sarif-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: sarif_in
          merge-multiple: true

      - name: Download container scan artifacts
        if: needs.container_build_and_scan.outputs.will_build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: container-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: sarif_in
        continue-on-error: true

      - name: Merge SARIFs
        run: |
          sudo apt-get update && sudo apt-get install -y dotnet-sdk-8.0 jq wkhtmltopdf
          dotnet tool install --global Sarif.Multitool
          export PATH="$PATH:$HOME/.dotnet/tools"
          shopt -s nullglob
          files=(sarif_in/**/*.sarif sarif_in/*.sarif)
          if [ ${#files[@]} -gt 0 ]; then
            sarif merge "${files[@]}" --output-file combined.sarif --log ForceOverwrite || true
          else
            jq -n '{version:"2.1.0", "$schema":"https://json.schemastore.org/sarif-2.1.0.json", runs:[]}' > combined.sarif
          fi

      - name: Build HTML summary from SARIF
        run: |
          node scripts/summarize-sarif.cjs \
            --in sarif_in \
            --combined combined.sarif \
            --zapBaselineDir zap_baseline \
            --zapFullDir zap_full \
            --out summary.html

      - name: Build PDF
        run: |
          wkhtmltopdf --enable-local-file-access summary.html combined.pdf || touch combined.pdf

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: security-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            combined.sarif
            summary.html
            combined.pdf

  # ---------------------------- Upload to Code Scanning UI ----------------------------
  upload-to-code-scanning:
    runs-on: ubuntu-latest
    needs: [aggregate]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: security-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: out

      - name: Upload merged SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/combined.sarif
